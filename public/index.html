<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover lets the app draw behind the iPhone status bar; the app pads itself
         with the safe-area insets so nothing ends up under the clock. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>TileTalk</title>
    <!-- TileTalk is dark in both light and dark mode. These colour the browser and iPhone status
         bars to match (#0F3D32 is colors.felt in src/theme.ts). -->
    <meta name="theme-color" content="#0F3D32" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- black-translucent: white clock and battery over the app's own dark green. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TileTalk" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        /* The tab bar's colour (colors.feltDeep), so anything showing past the app blends into it. */
        background-color: #0a2c24;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* On iPhones 100% can stop short of the bottom of the screen (Safari's toolbars, or the
         Home Screen app drawing under the clock), leaving a strip under the tab bar. dvh is the
         height actually visible right now. */
      @supports (height: 100dvh) {
        html,
        body,
        #root {
          height: 100dvh;
        }
      }
    </style>
  </head>

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
